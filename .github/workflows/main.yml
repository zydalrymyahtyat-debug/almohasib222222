name: بناء ملفات AAB و APK لتطبيق الدفتر الآمن 📱

on:
  push:
    branches:
      - main
      - master

permissions:
  contents: write

jobs:
  build-android:
    name: بناء تطبيق الأندرويد (AAB & APK)
    runs-on: ubuntu-latest

    steps:
      # جلب المشروع
      - name: Checkout Repository 📂
        uses: actions/checkout@v4

      # إعداد Node.js
      - name: Setup Node.js 🟢
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # تثبيت الاعتماديات
      - name: Install Dependencies 🛠️
        run: npm ci

      # بناء المشروع
      - name: Build Web App 🏗️
        run: npm run build

      # إعداد Java
      - name: Set up JDK 21 ☕
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: "21"

      # مزامنة Capacitor
      - name: Capacitor Sync 🔄
        run: npx cap sync

      # إصلاح Gradle Wrapper
      - name: Repair Gradle Wrapper 🛠️
        run: |
          cd android
          mkdir -p gradle/wrapper
          curl -L -o gradle/wrapper/gradle-wrapper.jar \
          https://raw.githubusercontent.com/gradle/gradle/v8.14.3/gradle/wrapper/gradle-wrapper.jar

      # إعطاء صلاحية التنفيذ
      - name: Grant Execute Permission 🔑
        run: chmod +x android/gradlew

      # بناء AAB و APK معاً
      - name: Build Android AAB & APK 🚀
        run: |
          cd android
          ./gradlew bundleRelease assembleRelease

      # إنشاء Tag تلقائي
      - name: Generate Tag 🏷️
        id: tag
        run: echo "tag=build-$(date +'%Y%m%d-%H%M%S')" >> $GITHUB_OUTPUT

      # إنشاء Release
      - name: Create GitHub Release 🚀
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: Build ${{ steps.tag.outputs.tag }}
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # رفع AAB و APK إلى Releases
      - name: Upload Build Artifacts to Release 📦
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          files: |
            android/app/build/outputs/bundle/release/app-release.aab
            android/app/build/outputs/apk/release/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
